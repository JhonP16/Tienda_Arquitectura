services:
  # Servicio de Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    volumes:
      # Persistencia: Esto asegura que los datos sobrevivan si apagas el contenedor
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password

  # Servicio de tu API Django (aislado: sin 'ports', solo Nginx lo alcanza)
  web:
    build: .
    # Gunicorn en lugar de runserver. 'Tienda' es la carpeta donde vive wsgi.py
    command: gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000
    volumes:
      # Hot-Reload: Mapeamos la carpeta actual para que los cambios de código se reflejen sin reiniciar
      - .:/app
    depends_on:
      - db
    environment:
      # Estas variables deben coincidir con lo que espera tu settings.py
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db  # ¡OJO! Aquí usamos el nombre del servicio 'db' como host
      - DB_PORT=5432
      # Permite servir la API desde la IP publica de EC2
      - DJANGO_ALLOWED_HOSTS=*
    # NOTA: Ya no hay sección 'ports' aquí. Django está aislado de internet.

  # Microservicio de pagos (v2) - EL ESTRANGULADOR
  pagos_flask:
    build: ./microservicio_pagos
    ports:
      - "5000:5000"  # Solo para pruebas iniciales, luego lo cerraremos

  # Proxy Inverso: el único servicio que da la cara a internet
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      # Inyectamos nuestro archivo de configuración en el contenedor
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - pagos_flask

# Definición del volumen persistente
volumes:
  postgres_data:
